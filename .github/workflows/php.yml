name: PHP Composer

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  permissions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.4']
        dolibarr: ['20.0.0', '24.0.0']
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only
          MARIADB_DATABASE: lmdbcrm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - uses: actions/checkout@v4
        with:
          repository: Dolibarr/dolibarr
          ref: ${{ matrix.dolibarr }}
          path: .test-cache/dolibarr
          sparse-checkout: |
            htdocs/core/boxes
            htdocs/core/modules
      - name: Lint module and tests
        run: find . -path './.test-cache' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Permission and native renderer regression tests
        env:
          LMDBCRM_CORE_SOURCE: ${{ github.workspace }}/.test-cache/dolibarr/htdocs
          LMDBCRM_CORE_VERSION: ${{ matrix.dolibarr }}
        run: php test/run.php
      - name: MariaDB scope and native registration tests
        env:
          LMDBCRM_CORE_SOURCE: ${{ github.workspace }}/.test-cache/dolibarr/htdocs
          LMDBCRM_CORE_VERSION: ${{ matrix.dolibarr }}
          LMDBCRM_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=lmdbcrm_test'
          LMDBCRM_TEST_USER: root
          LMDBCRM_TEST_PASSWORD: test-only
        run: php test/sql.php

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    # - name: Run test suite
    #   run: composer run-script test
